<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="title desc"><title id="title">Pipeline monitoring and metadata</title><desc id="desc">Illustrative system view based on resume experience: pipeline execution metadata is exposed through monitoring APIs for operations and governance. The internal Micron implementation is not reproduced.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#4a7668"/></marker></defs><rect width="960" height="290" rx="6" fill="#f2f5f1"/><rect x="28" y="52" width="200" height="120" rx="5" fill="white" stroke="#cad4cc"/><text x="44" y="79" font-family="Arial" font-size="10" fill="#62766a">01</text><text x="44" y="108" font-family="Arial" font-size="16" font-weight="bold" fill="#20372d">Global pipelines</text><text x="44" y="131" font-family="Arial" font-size="12" fill="#54635a">Manufacturing data</text><text x="44" y="150" font-family="Arial" font-size="12" fill="#54635a">ETL workloads</text><path d="M228 110 H255" stroke="#4a7668" marker-end="url(#arrow)"/><rect x="263" y="52" width="200" height="120" rx="5" fill="white" stroke="#cad4cc"/><text x="279" y="79" font-family="Arial" font-size="10" fill="#62766a">02</text><text x="279" y="108" font-family="Arial" font-size="16" font-weight="bold" fill="#20372d">Run metadata</text><text x="279" y="131" font-family="Arial" font-size="12" fill="#54635a">Pipeline identity</text><text x="279" y="150" font-family="Arial" font-size="12" fill="#54635a">Execution state</text><path d="M463 110 H490" stroke="#4a7668" marker-end="url(#arrow)"/><rect x="498" y="52" width="200" height="120" rx="5" fill="white" stroke="#cad4cc"/><text x="514" y="79" font-family="Arial" font-size="10" fill="#62766a">03</text><text x="514" y="108" font-family="Arial" font-size="16" font-weight="bold" fill="#20372d">Monitoring APIs</text><text x="514" y="131" font-family="Arial" font-size="12" fill="#54635a">Operational visibility</text><text x="514" y="150" font-family="Arial" font-size="12" fill="#54635a">Metadata access</text><path d="M698 110 H725" stroke="#4a7668" marker-end="url(#arrow)"/><rect x="733" y="52" width="200" height="120" rx="5" fill="white" stroke="#cad4cc"/><text x="749" y="79" font-family="Arial" font-size="10" fill="#62766a">04</text><text x="749" y="108" font-family="Arial" font-size="16" font-weight="bold" fill="#20372d">Operations</text><text x="749" y="131" font-family="Arial" font-size="12" fill="#54635a">Investigate failures</text><text x="749" y="150" font-family="Arial" font-size="12" fill="#54635a">Govern the data estate</text><path d="M28 205 H932" stroke="#c5d0c6"/><text x="480" y="242" text-anchor="middle" font-family="Arial" font-size="13" fill="#4c6454">Design concerns: run identity · pagination · freshness · query performance</text></svg>